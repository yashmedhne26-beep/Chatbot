<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #070716;
      color: #eef1ff;
    }

    /* ── Decorative full-screen atmosphere ── */
    .app-atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 8% -10%, rgba(124, 58, 237, 0.38), transparent 55%),
        radial-gradient(900px 600px at 100% 8%, rgba(14, 165, 233, 0.28), transparent 50%),
        radial-gradient(800px 500px at 70% 110%, rgba(236, 72, 153, 0.22), transparent 45%),
        linear-gradient(160deg, #0b1024 0%, #12102a 42%, #0a1628 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.7;
      animation: drift 18s ease-in-out infinite;
    }
    .orb-a {
      width: 42vw; height: 42vw; max-width: 560px; max-height: 560px;
      left: -8%; top: -12%;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
    }
    .orb-b {
      width: 36vw; height: 36vw; max-width: 480px; max-height: 480px;
      right: -10%; top: 18%;
      background: radial-gradient(circle, #22d3ee 0%, transparent 70%);
      animation-delay: -6s;
    }
    .orb-c {
      width: 28vw; height: 28vw; max-width: 380px; max-height: 380px;
      left: 32%; bottom: -16%;
      background: radial-gradient(circle, #f472b6 0%, transparent 70%);
      animation-delay: -11s;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, -5%) scale(1.08); }
    }

    .mesh-ring {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      box-shadow: inset 0 0 80px rgba(124, 58, 237, 0.12);
    }
    .mesh-ring.r1 { width: 52vmin; height: 52vmin; right: 6%; top: 22%; }
    .mesh-ring.r2 { width: 34vmin; height: 34vmin; right: 12%; top: 31%; border-color: rgba(34, 211, 238, 0.14); }

    .starfield::before,
    .starfield::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.7), transparent),
        radial-gradient(1.5px 1.5px at 28% 72%, rgba(255,255,255,.45), transparent),
        radial-gradient(1px 1px at 46% 32%, rgba(255,255,255,.55), transparent),
        radial-gradient(2px 2px at 63% 12%, rgba(165, 243, 252,.6), transparent),
        radial-gradient(1px 1px at 81% 64%, rgba(255,255,255,.4), transparent),
        radial-gradient(1.5px 1.5px at 91% 28%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 8% 88%, rgba(196, 181, 253,.55), transparent);
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
    }
    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── Full-screen app shell ── */
    .chat-container {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      margin: 0;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      border: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(10,12,28,0.55) 0%, rgba(8,10,24,0.72) 100%);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }

    :fullscreen .chat-container,
    :-webkit-full-screen .chat-container,
    :-moz-full-screen .chat-container {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    #fullscreenBtn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      color: #fff; font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
      margin-left: 4px;
      backdrop-filter: blur(10px);
    }
    #fullscreenBtn:hover  { background: rgba(255,255,255,0.18); transform: scale(1.06); border-color: rgba(255,255,255,0.32); }
    #fullscreenBtn:active { transform: scale(0.94); }

    /* ── Header ── */
    .chat-header {
      flex-shrink: 0;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(90deg, rgba(124,58,237,0.42), rgba(14,165,233,0.28) 55%, rgba(244,114,182,0.22));
      border-bottom: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.18);
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bot-avatar {
      width: 50px; height: 50px;
      background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0.06));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.35);
    }

    .bot-info h2 {
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .bot-info p  { color: rgba(255,255,255,0.78); font-size: 12px; margin-top: 3px; }

    .status-dot {
      width: 8px; height: 8px; background: #4ade80;
      border-radius: 50%; display: inline-block; margin-right: 5px;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }



    /* ── Messages area ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 8vw 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.22) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 8px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: linear-gradient(#7c3aed, #22d3ee);
      border-radius: 8px;
    }

    .message {
      display: flex; align-items: flex-end; gap: 10px;
      max-width: min(72%, 820px);
      animation: fadeIn 0.32s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .message.bot  { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .message.bot  .msg-avatar { background: linear-gradient(135deg,#7c3aed,#22d3ee); }
    .message.user .msg-avatar { background: linear-gradient(135deg,#f472b6,#fb7185); }

    .bubble {
      padding: 12px 16px; border-radius: 20px;
      font-size: 15px; line-height: 1.65; word-break: break-word;
    }
    .message.bot  .bubble {
      background: rgba(255,255,255,0.08);
      color: #eef1ff;
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom-left-radius: 6px;
      backdrop-filter: blur(18px);
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #7c3aed, #2563eb 55%, #22d3ee);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
    }

    .bubble ul, .bubble ol { padding-left: 20px; margin: 8px 0; }
    .bubble li { margin-bottom: 4px; }
    .bubble p { margin-bottom: 8px; }
    .bubble p:last-child { margin-bottom: 0; }
    .bubble pre {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      overflow-x: auto;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      margin: 8px 0;
      color: #7dd3fc;
    }
    .bubble code {
      background: rgba(255, 255, 255, 0.12);
      padding: 2px 6px;
      border-radius: 6px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      color: #a5f3fc;
    }
    .bubble pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    .timestamp {
      font-size: 11px;
      color: rgba(255,255,255,0.32);
      margin-top: 0;
      text-align: center;
      align-self: center;
    }




    .typing-indicator {
      display:flex; align-items:flex-end; gap:10px;
      max-width:85%; align-self:flex-start; animation:fadeIn 0.3s ease;
    }
    .typing-dots {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 14px 18px;
      border-radius: 20px; border-bottom-left-radius: 6px;
      display:flex; gap:5px; align-items:center;
      backdrop-filter: blur(16px);
    }
    .dot { width:7px; height:7px; background:#a78bfa; border-radius:50%; animation:bounce 1.2s infinite; }
    .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .composer-dock {
      flex-shrink: 0;
      padding: 0 8vw 22px;
      background: linear-gradient(180deg, transparent, rgba(6,8,20,0.55) 28%);
    }

    .quick-replies { display:flex; flex-wrap:wrap; gap:8px; padding: 4px 0 12px; }
    .quick-reply-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(167, 139, 250, 0.45);
      color: #ddd6fe;
      padding: 8px 16px; border-radius: 999px;
      font-size: 13px; cursor: pointer; transition: all 0.2s;
      backdrop-filter: blur(12px);
      font-family: inherit;
    }
    .quick-reply-btn:hover {
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      color: #fff;
      border-color: transparent;
      transform: translateY(-1px);
    }

    .chat-input-area {
      padding: 10px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      display: flex; gap: 8px; align-items: center;
      backdrop-filter: blur(24px) saturate(150%);
      box-shadow: 0 16px 50px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 24px;
      padding: 12px 10px;
      color: #eef1ff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    #userInput::placeholder { color: rgba(255,255,255,0.35); }

    #sendBtn {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      border: none; border-radius: 16px; color: #fff; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, opacity 0.2s; flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.38);
    }
    #sendBtn:hover  { transform: scale(1.07); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

    .icon-btn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(167, 139, 250, 0.28);
      border-radius: 14px;
      color: #c4b5fd; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: #7c3aed; color: #fff; transform: scale(1.06); }
    .icon-btn:active { transform: scale(0.93); }

    #attachBtn, #micBtn, #ttsBtn { }

    #micBtn.recording {
      background: #ef4444 !important;
      color: #fff !important;
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 0 rgba(239,68,68,0.7);
      animation: micPulse 1.2s infinite;
    }
    @keyframes micPulse {
      0%   { box-shadow: 0 0 0 0   rgba(239,68,68,0.7); }
      70%  { box-shadow: 0 0 0 12px rgba(239,68,68,0);   }
      100% { box-shadow: 0 0 0 0   rgba(239,68,68,0);   }
    }
    #ttsBtn.muted  { color: #555; border-color: #333; }

    .speaking-wave {
      display: inline-flex; gap: 3px; align-items: flex-end;
      height: 14px; margin-left: 8px; vertical-align: middle;
    }
    .speaking-wave span {
      width: 3px; border-radius: 3px;
      background: #22d3ee;
      animation: wave 0.9s ease-in-out infinite;
    }
    .speaking-wave span:nth-child(1) { height: 5px;  animation-delay: 0s;    }
    .speaking-wave span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .speaking-wave span:nth-child(3) { height: 7px;  animation-delay: 0.3s;  }
    .speaking-wave span:nth-child(4) { height: 12px; animation-delay: 0.45s; }
    .speaking-wave span:nth-child(5) { height: 4px;  animation-delay: 0.6s;  }
    @keyframes wave {
      0%, 100% { transform: scaleY(1);   }
      50%       { transform: scaleY(1.9); }
    }

    #imgPreviewStrip {
      display: none;
      padding: 0 0 10px;
      gap: 8px;
      flex-wrap: wrap;
    }
    #imgPreviewStrip.has-images { display: flex; }

    .preview-thumb-wrap {
      position: relative;
      width: 64px; height: 64px;
      border-radius: 14px;
      overflow: visible;
      flex-shrink: 0;
    }
    .preview-thumb-wrap img {
      width: 64px; height: 64px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #a78bfa;
      display: block;
    }
    .preview-thumb-remove {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px;
      background: #f87171; color: #fff;
      border-radius: 50%; border: none;
      font-size: 11px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .preview-thumb-remove:hover { background: #ef4444; }

    .chat-img-bubble {
      max-width: 280px;
      border-radius: 14px;
      overflow: hidden;
      cursor: zoom-in;
      border: 2px solid rgba(167, 139, 250, 0.4);
      display: block;
      transition: transform 0.2s;
    }
    .chat-img-bubble:hover { transform: scale(1.03); }

    #imgLightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 3000;
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #imgLightbox.open { display: flex; }
    #imgLightbox img {
      max-width: 90vw; max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      animation: fadeIn 0.2s ease;
    }

    .user-avatar-wrap {
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .user-avatar-wrap:hover .cam-overlay { opacity: 1; }

    .user-header-avatar {
      width: 44px; height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.4);
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg,#f472b6,#fb7185);
    }
    .user-avatar-emoji {
      width: 44px; height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg,#f472b6,#fb7185);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .cam-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.55);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .avatar-modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(4, 6, 18, 0.62);
      backdrop-filter: blur(10px);
      z-index: 2000;
      align-items: center; justify-content: center;
    }
    .avatar-modal-backdrop.open { display: flex; }

    .avatar-modal {
      background: rgba(18, 16, 40, 0.86);
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 24px;
      padding: 28px 26px;
      width: 340px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
      animation: fadeIn 0.25s ease;
      backdrop-filter: blur(24px);
    }
    .avatar-modal h3 { color: #e0e0f0; font-size: 16px; margin-bottom: 18px; }

    .avatar-preview-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      margin: 0 auto 18px;
      border: 3px dashed #a78bfa;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      font-size: 40px;
      position: relative;
    }
    #modalPreviewImg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: none;
      border-radius: 50%;
    }
    #modalPreviewEmoji { font-size: 40px; }

    .avatar-modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

    .btn-upload {
      background: linear-gradient(135deg,#7c3aed,#22d3ee);
      color: #fff; border: none;
      padding: 11px; border-radius: 30px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
      font-family: inherit;
    }
    .btn-upload:hover { opacity: 0.85; }

    .btn-remove {
      background: transparent;
      color: #f87171; border: 1px solid #f87171;
      padding: 9px; border-radius: 30px;
      font-size: 13px; cursor: pointer;
      transition: all 0.2s;
      display: none;
      font-family: inherit;
    }
    .btn-remove:hover { background: #f87171; color: #fff; }
    .btn-remove.visible { display: block; }

    .btn-close-modal {
      background: transparent; color: #888;
      border: none; font-size: 13px;
      cursor: pointer; margin-top: 4px;
      transition: color 0.2s;
      font-family: inherit;
    }
    .btn-close-modal:hover { color: #ccc; }

    .msg-avatar img {
      width: 100%; height: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    #micStatus {
      display: none;
      background: linear-gradient(90deg, #7c3aed, #22d3ee);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 8px 14px;
      letter-spacing: .4px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    /* ── Generated image in chat ── */
    .gen-img-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .gen-img-bubble {
      max-width: 300px;
      width: 100%;
      border-radius: 16px;
      border: 2px solid rgba(124, 58, 237, 0.5);
      box-shadow: 0 8px 28px rgba(124, 58, 237, 0.28);
      display: block;
      cursor: zoom-in;
      transition: transform 0.2s, box-shadow 0.2s;
      background: rgba(255,255,255,0.05);
    }
    .gen-img-bubble:hover { transform: scale(1.03); box-shadow: 0 12px 36px rgba(124,58,237,0.45); }
    .gen-img-skeleton {
      width: 300px; height: 200px;
      border-radius: 16px;
      background: linear-gradient(90deg, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.06) 75%);
      background-size: 400% 100%;
      animation: shimmer 1.4s infinite;
      border: 2px solid rgba(124,58,237,0.3);
    }
    @keyframes shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: -100% 0; }
    }
    .quick-reply-btn.img-btn {
      background: linear-gradient(135deg, rgba(124,58,237,0.18), rgba(244,114,182,0.18));
      border-color: rgba(244, 114, 182, 0.55);
      color: #f9a8d4;
    }
    .quick-reply-btn.img-btn:hover {
      background: linear-gradient(135deg, #7c3aed, #f472b6);
      border-color: transparent;
      color: #fff;
    }

    @media (max-width: 720px) {

<script>
  /* ══════════════════════════════
     IMAGE ATTACHMENT SYSTEM
  ══════════════════════════════ */
  let pendingImages = []; // array of { dataUrl, name }

  function handleChatImageSelect(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    files.forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingImages.push({ dataUrl: e.target.result, name: file.name });
        renderPreviewStrip();
      };
      reader.readAsDataURL(file);
    });

    event.target.value = '';
  }

  function renderPreviewStrip() {
    const strip = document.getElementById('imgPreviewStrip');
    strip.innerHTML = '';

    if (pendingImages.length === 0) {
      strip.classList.remove('has-images');
      return;
    }

    strip.classList.add('has-images');
    pendingImages.forEach((img, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-thumb-wrap';

      const thumb = document.createElement('img');
      thumb.src = img.dataUrl;
      thumb.alt = img.name;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'preview-thumb-remove';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove';
      removeBtn.onclick = () => {
        pendingImages.splice(idx, 1);
        renderPreviewStrip();
      };

      wrap.appendChild(thumb);
      wrap.appendChild(removeBtn);
      strip.appendChild(wrap);
    });
  }

  function addImageMessage(dataUrl, name) {
    const container = document.getElementById('chatMessages');
    const wrapper   = document.createElement('div');
    wrapper.className = 'message user';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    if (userAvatarDataUrl) {
      const avImg = document.createElement('img');
      avImg.src = userAvatarDataUrl;
      avImg.alt = 'You';
      avatar.appendChild(avImg);
    } else {
      avatar.textContent = '👤';
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.style.padding = '6px';

    const chatImg = document.createElement('img');
    chatImg.src = dataUrl;
    chatImg.alt = name || 'Image';
    chatImg.className = 'chat-img-bubble';
    chatImg.onclick = () => openLightbox(dataUrl);
    chatImg.title = '🔍 Click to enlarge';

    bubble.appendChild(chatImg);
    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    container.appendChild(wrapper);

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = getTime();
    container.appendChild(ts);

    container.scrollTop = container.scrollHeight;
    return wrapper;
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('imgLightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('imgLightbox').classList.remove('open');
    document.getElementById('lightboxImg').src = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  let userAvatarDataUrl = null;

  function openAvatarModal() {
    document.getElementById('avatarModalBackdrop').classList.add('open');
  }

  function closeAvatarModal() {
    document.getElementById('avatarModalBackdrop').classList.remove('open');
  }

  function backdropClose(e) {
    if (e.target === document.getElementById('avatarModalBackdrop')) closeAvatarModal();
  }

  function handleAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file || !file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      userAvatarDataUrl = e.target.result;

      document.getElementById('modalPreviewImg').src   = userAvatarDataUrl;
      document.getElementById('modalPreviewImg').style.display  = 'block';
      document.getElementById('modalPreviewEmoji').style.display = 'none';
      document.getElementById('btnRemovePhoto').classList.add('visible');

      document.getElementById('userHeaderAvatarImg').src          = userAvatarDataUrl;
      document.getElementById('userHeaderAvatarImg').style.display = 'block';
      document.getElementById('userHeaderAvatarEmoji').style.display = 'none';

      setTimeout(closeAvatarModal, 600);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function removeAvatar() {
    userAvatarDataUrl = null;

    document.getElementById('modalPreviewImg').style.display   = 'none';
    document.getElementById('modalPreviewImg').src             = '';
    document.getElementById('modalPreviewEmoji').style.display = '';
    document.getElementById('btnRemovePhoto').classList.remove('visible');

    document.getElementById('userHeaderAvatarImg').style.display  = 'none';
    document.getElementById('userHeaderAvatarImg').src            = '';
    document.getElementById('userHeaderAvatarEmoji').style.display = '';

    closeAvatarModal();
  }

  /* ══════════════════════════════════════════════════════
     COMPREHENSIVE GENERAL KNOWLEDGE AI ASSISTANT SYSTEM
  ══════════════════════════════════════════════════════ */
  const SYSTEM_INSTRUCTION = `You are Nova, an exceptionally intelligent, universally capable, comprehensive general knowledge AI assistant, modeled after premier frontier models like Google Gemini and OpenAI GPT.

Core Capabilities & Broad Knowledge Base:
1. Universal Scope: You are NOT restricted to any narrow domain or canned Q&A. You handle queries across all branches of human knowledge with expert depth and accuracy.
2. Complex Reasoning & Mathematics: Solve advanced mathematical equations, calculus, algebra, statistics, logic puzzles, probability, and physics computations with step-by-step clarity.
3. Computer Science & Software Engineering: Write, review, optimize, and debug code in all major languages (Python, JavaScript, TypeScript, C, C++, Java, Rust, Go, SQL, HTML/CSS, Shell, etc.). Provide production-quality code snippets, algorithmic time/space complexities, and best practices.
4. Science & Technology: Explain quantum mechanics, genetics, biotechnology, astrophysics, machine learning, artificial intelligence, robotics, thermodynamics, chemistry, and environmental science from intuitive fundamentals to advanced graduate levels.
5. World Affairs, History & Humanities: Discuss world history, geopolitics, global economies, philosophy (Western & Eastern), sociology, law, geography, and international relations with nuance and factual objectivity.
6. Creative Writing & Communication: Compose compelling stories, poems, speeches, professional essays, cover letters, marketing copy, structured reports, and brainstorm novel concepts.
7. Educational Pedagogical Clarity: Tailor explanations to the user's level, breaking down intricate topics into easily digestible steps with insightful analogies and structured outlines.

Communication & Tone Guidelines:
- Primary Language: Respond naturally, politely, and fluently in Hindi (or Hinglish/English as appropriate to the user's input).
- Tone: Friendly, insightful, objective, patient, and highly helpful.
- Formatting: Use clean markdown, bullet points, headers, bold text for key terms, and formatted code blocks for clarity.`;

  let conversationHistory = [
    {
      role: "system",
      content: SYSTEM_INSTRUCTION
    }
  ];

  /* ── Image generation state ── */
  let isWaitingForImagePrompt = false;

  function triggerImageMode() {
    isWaitingForImagePrompt = true;
    document.getElementById('quickReplies').style.display = 'none';
    const msg = "ज़रूर! आप किस चीज़ की image बनवाना चाहते हैं? मुझे बताइए — जैसे: 'सूर्यास्त का दृश्य' या 'अंतरिक्ष में तैरता अंतरिक्ष यात्री'।";
    const el = addMessage(msg, 'bot');
    speak(msg, el);
    document.getElementById('userInput').placeholder = 'Image का विवरण लिखिए…';
    document.getElementById('userInput').focus();
  }

  function generateImage(prompt) {
    showTyping();
    const seed    = Math.floor(Math.random() * 99999);
    const encoded = encodeURIComponent(prompt);
    const imgUrl  = `https://image.pollinations.ai/prompt/${encoded}?width=512&height=512&nologo=true&seed=${seed}`;

    setTimeout(() => {
      removeTyping();

      const container = document.getElementById('chatMessages');
      const wrapper   = document.createElement('div');
      wrapper.className = 'message bot';

      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.style.background = 'linear-gradient(135deg,#7c3aed,#22d3ee)';
      avatar.textContent = '✦';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const wrap = document.createElement('div');
      wrap.className = 'gen-img-wrap';

      const caption = document.createElement('span');
      const captionText = `आपकी image तैयार की जा रही है: "${prompt}"`;
      caption.textContent = captionText;
      wrap.appendChild(caption);

      const skeleton = document.createElement('div');
      skeleton.className = 'gen-img-skeleton';
      wrap.appendChild(skeleton);

      bubble.appendChild(wrap);
      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      container.appendChild(wrapper);

      const ts = document.createElement('div');
      ts.className = 'timestamp';
      ts.textContent = getTime();
      container.appendChild(ts);
      container.scrollTop = container.scrollHeight;

      speak(captionText, wrapper);

      const img = new Image();
      img.onload = () => {
        img.className = 'gen-img-bubble';
        img.alt = prompt;
        img.title = '🔍 बड़ा करने के लिए क्लिक करें';
        img.onclick = () => openLightbox(imgUrl);
        skeleton.replaceWith(img);
        container.scrollTop = container.scrollHeight;

        const doneText = "Image तैयार है! पसंद आई? एक और बनवाने के लिए '🎨 Image बनाएं' दबाएं।";
        const doneEl = addMessage(doneText, 'bot');
        speak(doneText, doneEl);
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('userInput').placeholder = 'Nova से पूछिए…';
        document.getElementById('userInput').focus();
      };
      img.onerror = () => {
        skeleton.replaceWith(document.createTextNode('❌ Image नहीं बन सकी। कृपया दोबारा कोशिश करें।'));
        container.scrollTop = container.scrollHeight;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('userInput').placeholder = 'Nova से पूछिए…';
      };
      img.src = imgUrl;

    }, 600);
  }

  /* ── Core AI Reasoning & Generation Function ── */
  async function fetchAIResponse(userText) {
    const lower = userText.toLowerCase().trim();

    // Check if user is asking to create an image
    const imageKeywords = ['image banao','photo banao','tasveer banao','image generate','create image','draw','paint','generate image','make image','photo generate','picture banao','artwork'];
    if (imageKeywords.some(kw => lower.includes(kw))) {
      isWaitingForImagePrompt = true;
      document.getElementById('userInput').placeholder = 'Image का विवरण लिखिए…';
      return "ज़रूर! आप किस चीज़ की image बनवाना चाहते हैं? मुझे बताइए — जैसे: 'सूर्यास्त का दृश्य' या 'रोबोट का चित्र'।";
    }

    // Direct math evaluation for pure expressions
    if (/^[\d\s\+\-\*\/\.\(\)\^\%]+$/.test(lower) && lower.length > 1 && !/[a-zA-Z]/.test(lower)) {
      try {
        const mathExpr = lower.replace(/\^/g, '**');
        const result = Function('"use strict"; return (' + mathExpr + ')')();
        if (!isNaN(result)) return `गणना का सटीक उत्तर: **${result}**`;
      } catch(e) {}
    }

    // Maintain conversation context
    conversationHistory.push({ role: "user", content: userText });
    if (conversationHistory.length > 16) {
      conversationHistory = [conversationHistory[0], ...conversationHistory.slice(-12)];
    }

    // 1. Try Live General-Knowledge AI Endpoint (Pollinations Text AI with GPT/Gemini backbone)
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      const response = await fetch("https://text.pollinations.ai/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages: conversationHistory,
          model: "openai",
          seed: Math.floor(Math.random() * 100000),
          jsonMode: false
        }),
        signal: controller.signal
      });

      clearTimeout(timeoutId);

      if (response.ok) {
        const aiText = await response.text();
        if (aiText && aiText.trim()) {
          const cleanReply = aiText.trim();
          conversationHistory.push({ role: "assistant", content: cleanReply });
          return cleanReply;
        }
      } else {
        // Fallback GET request
        const sysPrompt = encodeURIComponent(SYSTEM_INSTRUCTION);
        const userPrompt = encodeURIComponent(userText);
        const getRes = await fetch(`https://text.pollinations.ai/${userPrompt}?system=${sysPrompt}&model=openai`);
        if (getRes.ok) {
          const text = await getRes.text();
          if (text && text.trim()) {
            conversationHistory.push({ role: "assistant", content: text.trim() });
            return text.trim();
          }
        }
      }
    } catch (err) {
      console.warn("Live AI endpoint unavailable or timed out, falling back to comprehensive offline knowledge engine:", err);
    }

    // 2. Fallback: Comprehensive Built-in Knowledge Engine
    return getComprehensiveOfflineResponse(userText);
  }

  /* ── Comprehensive Offline Knowledge & Reasoning Engine ── */
  function getComprehensiveOfflineResponse(input) {
    const lower = input.toLowerCase().trim();

    // Greetings
    if (/^(hi|hello|hey|namaste|namaskar|helo|hii|pranam|suprabhat)/i.test(lower)) {
      return "नमस्ते! मैं Nova हूँ — आपका सर्वज्ञानी AI सहायक। आप मुझसे विज्ञान, कोडिंग, गणित, इतिहास, साहित्य, दुनिया के मामले या किसी भी विषय पर कुछ भी पूछ सकते हैं!";
    }

    // Identity / Capabilities
    if (lower.includes('who are you') || lower.includes('kaun ho') || lower.includes('what can you do') || lower.includes('kya kar sakte ho') || lower.includes('madad')) {
      return `मैं **Nova AI Assistant** हूँ — Google Gemini और GPT की तरह एक उच्च बौद्धिक AI सहायक।

मैं इन सभी विषयों पर आपकी व्यापक सहायता कर सकता हूँ:
• 🧠 **विस्तृत सामान्य ज्ञान:** विज्ञान, तकनीक, इतिहास, भूगोल, अंतरिक्ष और समसामयिक मामले
• 💻 **प्रोग्रामिंग और कोडिंग:** Python, JavaScript, C++, HTML/CSS आदि में कोड लिखना व डिबग करना
• 🧮 **गणित व तार्किक समस्याएँ:** जटिल समीकरण, बीजगणित, सांख्यिकी और गणना
• ✍️ **रचनात्मक लेखन:** निबंध, कविताएं, पत्र, कहानियाँ और विचार-विमर्श
• 🎨 **छवि निर्माण:** 'Image बनाएं' फीचर से कोई भी चित्र तैयार करना

बताइए, आज आप क्या सीखना या हल करना चाहते हैं?`;
    }

    // Coding questions
    if (lower.includes('code') || lower.includes('python') || lower.includes('javascript') || lower.includes('html') || lower.includes('css') || lower.includes('program') || lower.includes('function')) {
      return `बिल्कुल! मैं कोडिंग और सॉफ्टवेयर डेवलपमेंट से जुड़े सभी सवालों को हल कर सकता हूँ। आप मुझे समस्या का विवरण, प्रोग्रामिंग भाषा, या एरर (error) बता सकते हैं और मैं आपको सटीक कोड और विस्तृत व्याख्या प्रदान करूँगा।`;
    }

    // Science & Tech
    if (lower.includes('ai') || lower.includes('artificial intelligence') || lower.includes('machine learning') || lower.includes('quantum') || lower.includes('space') || lower.includes('gravity')) {
      return `यह विज्ञान और तकनीक का एक अत्यंत महत्वपूर्ण और गहरा विषय है! कृत्रिम बुद्धिमत्ता (AI) और आधुनिक विज्ञान हमारे सोचने, सीखने और समस्याओं को सुलझाने के तरीके में क्रांतिकारी परिवर्तन ला रहे हैं। आप इस विषय में क्या विशेष जानना चाहते हैं?`;
    }

    // Jokes
    if (lower.includes('joke') || lower.includes('chutkula') || lower.includes('hasao') || lower.includes('mazak')) {
      const jokes = [
        "प्रोग्रामर अंधेरे में काम क्यों करते हैं? क्योंकि उजाले में बग (bugs) आकर्षित होते हैं! 😄",
        "कंप्यूटर को बुखार क्यों आया? क्योंकि उसमें एक वायरस घुस गया था! 😂",
        "Java डेवलपर चश्मा क्यों लगाते हैं? क्योंकि उन्हें C# (सी-शार्प) दिखाई नहीं देता! 👓"
      ];
      return jokes[Math.floor(Math.random() * jokes.length)];
    }

    // Time & Date
    if (lower.includes('time') || lower.includes('samay') || lower.includes('kitne baje')) {
      return `वर्तमान समय: **${new Date().toLocaleTimeString('hi-IN', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}**`;
    }
    if (lower.includes('date') || lower.includes('tarikh') || lower.includes('aaj kya')) {
      return `आज की तारीख: **${new Date().toLocaleDateString('hi-IN', {weekday:'long', year:'numeric', month:'long', day:'numeric'})}**`;
    }

    // Thanks
    if (lower.includes('thank') || lower.includes('shukriya') || lower.includes('dhanyawad')) {
      return "आपका बहुत-बहुत स्वागत है! यदि आपके पास कोई और सवाल, कोडिंग समस्या या विचार हो तो बेझिझक पूछिए।";
    }

    // General Intelligent Fallback
    return `आपकी बात को मैंने समझ लिया है: "${input}"। 

यह एक बहुत ही विचारणीय और महत्वपूर्ण विषय है। इस पर गहराई से चर्चा करने के लिए क्या आप कोई विशिष्ट विवरण या संदर्भ जोड़ना चाहेंगे? मैं आपकी पूरी और सटीक सहायता करने के लिए तैयार हूँ।`;
  }

  let messageCount = 0;

  function getTime() {
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function renderText(text) {
    if (!text) return '';

    let formatted = text.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
      const safeCode = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const langLabel = lang ? `<span style="font-size:11px;color:#94a3b8;display:block;margin-bottom:4px;text-transform:uppercase;">${lang}</span>` : '';
      return `<pre>${langLabel}<code>${safeCode.trim()}</code></pre>`;
    });

    formatted = formatted.replace(/`([^`]+)`/g, (match, code) => {
      return `<code>${code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</code>`;
    });

    // Bold & Italics
    formatted = formatted.replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>');
    formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    formatted = formatted.replace(/\*(.*?)\*/g, '<em>$1</em>');

    // Headers
    formatted = formatted.replace(/^### (.*$)/gim, '<h4 style="margin:6px 0;font-size:15px;color:#c4b5fd;">$1</h4>');
    formatted = formatted.replace(/^## (.*$)/gim, '<h3 style="margin:8px 0;font-size:16px;color:#a78bfa;">$1</h3>');
    formatted = formatted.replace(/^# (.*$)/gim, '<h2 style="margin:10px 0;font-size:17px;color:#e0e7ff;">$1</h2>');

    // Lists and paragraphs
    const lines = formatted.split('\n');
    let html = '';
    let inList = false;

    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith('•') || trimmed.startsWith('-') || trimmed.startsWith('* ')) {
        if (!inList) { html += '<ul>'; inList = true; }
        const itemText = trimmed.replace(/^[•\-\*]\s*/, '');
        html += `<li>${itemText}</li>`;
      } else if (/^\d+\.\s+/.test(trimmed)) {
        if (!inList) { html += '<ol>'; inList = true; }
        const itemText = trimmed.replace(/^\d+\.\s+/, '');
        html += `<li>${itemText}</li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        if (trimmed) {
          html += (html && !html.endsWith('>') ? '<br>' : '') + line;
        } else {
          html += '<br>';
        }
      }
    });

    if (inList) html += '</ul>';
    return html;
  }

  function addMessage(text, sender) {
    const container = document.getElementById('chatMessages');
    const wrapper   = document.createElement('div');
    wrapper.className = `message ${sender}`;

    const avatar  = document.createElement('div');
    avatar.className = 'msg-avatar';

    if (sender === 'bot') {
      avatar.textContent = '✦';
    } else if (userAvatarDataUrl) {
      const img = document.createElement('img');
      img.src = userAvatarDataUrl;
      img.alt = 'You';
      avatar.appendChild(img);
    } else {
      avatar.textContent = '👤';
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderText(text);

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    container.appendChild(wrapper);

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = getTime();
    container.appendChild(ts);

    container.scrollTop = container.scrollHeight;
    return wrapper;
  }

  function showTyping() {
    const container = document.getElementById('chatMessages');
    const typing    = document.createElement('div');
    typing.className = 'typing-indicator';
    typing.id = 'typingIndicator';

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.style.background = 'linear-gradient(135deg,#7c3aed,#22d3ee)';
    av.textContent = '✦';

    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    typing.appendChild(av);
    typing.appendChild(dots);
    container.appendChild(typing);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const text  = input.value.trim();
    const hasImages = pendingImages.length > 0;

    if (!text && !hasImages) return;

    if (hasImages) {
      const imagesToSend = [...pendingImages];
      pendingImages = [];
      renderPreviewStrip();
      imagesToSend.forEach(img => addImageMessage(img.dataUrl, img.name));
    }

    if (!text) return;

    messageCount++;
    addMessage(text, 'user');
    input.value = '';

    document.getElementById('sendBtn').disabled = true;
    document.getElementById('quickReplies').style.display = 'none';

    if (isWaitingForImagePrompt) {
      isWaitingForImagePrompt = false;
      generateImage(text);
      return;
    }

    showTyping();

    try {
      const reply = await fetchAIResponse(text);
      removeTyping();
      const msgEl = addMessage(reply, 'bot');
      speak(reply, msgEl);
    } catch (err) {
      removeTyping();
      const fallback = getComprehensiveOfflineResponse(text);
      const msgEl = addMessage(fallback, 'bot');
      speak(fallback, msgEl);
    } finally {
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }
  }

  function sendQuick(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  document.getElementById('userInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });

  window.addEventListener('load', () => {
    setTimeout(() => {
      const welcomeText = "नमस्ते! मैं Nova Assistant हूँ। आज मैं आपकी कैसे मदद कर सकता हूँ?";
      const el = addMessage(welcomeText, 'bot');
      speak(welcomeText, el);
    }, 400);
  });


  function toggleFullscreen() {
    const el = document.documentElement;
    const isFs = !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement
    );

    if (!isFs) {
      if      (el.requestFullscreen)       el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
    } else {
      if      (document.exitFullscreen)       document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
    }
  }

  function onFullscreenChange() {
    const isFs = !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement
    );
    const btn = document.getElementById('fullscreenBtn');
    btn.textContent = isFs ? '⊠' : '⛶';
    btn.title       = isFs ? 'Exit fullscreen' : 'Enter fullscreen';
  }

  document.addEventListener('fullscreenchange',       onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
  document.addEventListener('mozfullscreenchange',    onFullscreenChange);

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition  = null;
  let isListening  = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang          = 'hi-IN';
    recognition.interimResults = true;
    recognition.continuous     = false;

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('micBtn').title = 'सुनना बंद करें';
      document.getElementById('micStatus').style.display = 'block';
      document.getElementById('userInput').placeholder   = '🎙️ सुन रहा हूँ…';
    };

    recognition.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else                       interim += t;
      }
      document.getElementById('userInput').value = final || interim;
    };

    recognition.onend = () => {
      isListening = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('micBtn').title = 'आवाज़ से संदेश भेजें';
      document.getElementById('micStatus').style.display = 'none';
      document.getElementById('userInput').placeholder   = 'Nova से पूछिए…';

      const txt = document.getElementById('userInput').value.trim();
      if (txt) sendMessage();
    };

    recognition.onerror = (e) => {
      console.warn('STT error:', e.error);
      isListening = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('micStatus').style.display = 'none';
      document.getElementById('userInput').placeholder   = 'Nova से पूछिए…';
      if (e.error === 'not-allowed') {
        alert('माइक्रोफ़ोन की अनुमति नहीं मिली। कृपया ब्राउज़र सेटिंग में माइक की अनुमति दें।');
      }
    };
  }

  function toggleMic() {
    if (!SpeechRecognition) {
      alert('⚠️ Your browser does not support Speech Recognition.\nPlease use Chrome or Edge.');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  }

  let ttsEnabled    = true;
  let currentUtter  = null;
  let activeTtsBubble = null;

  function toggleTTS() {
    ttsEnabled = !ttsEnabled;
    const btn = document.getElementById('ttsBtn');
    if (ttsEnabled) {
      btn.textContent = '🔊';
      btn.title       = 'Mute voice replies';
      btn.classList.remove('muted');
    } else {
      btn.textContent = '🔇';
      btn.title       = 'Unmute voice replies';
      btn.classList.add('muted');
      window.speechSynthesis.cancel();
      removeWave();
    }
  }

  function speak(text, bubbleEl) {
    if (!ttsEnabled || !window.speechSynthesis) return;

    window.speechSynthesis.cancel();
    removeWave();

    let clean = text
      .replace(/```[\s\S]*?```/g, ' [कोड ब्लॉक] ') // skip reading long raw code syntax
      .replace(/`([^`]+)`/g, '$1')                // inline code text
      .replace(/^#{1,6}\s+/gm, '')                // headers
      .replace(/\*\*\*(.*?)\*\*\*/g, '$1')
      .replace(/\*\*(.*?)\*\*/g, '$1')           // bold
      .replace(/\*(.*?)\*/g, '$1')               // italic
      .replace(/^[•\-\*]\s+/gm, '')              // bullets
      .replace(/^>\s+/gm, '')                    // blockquotes
      .replace(/[\u{1F300}-\u{1FAFF}]/gu, '')    // emojis
      .replace(/[✦★☆#_]/g, '')                   // misc symbols
      .replace(/\n+/g, ' ')                      // newlines → space
      .replace(/\s{2,}/g, ' ')                   // collapse multiple spaces
      .trim();

    if (!clean) return;

    const utterance  = new SpeechSynthesisUtterance(clean);
    utterance.lang   = 'hi-IN';
    utterance.rate   = 0.95;
    utterance.pitch  = 1.05;
    utterance.volume = 1.0;

    const setVoiceAndSpeak = () => {
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v =>
        v.lang.startsWith('hi') && (v.name.includes('Google') || v.name.includes('Microsoft'))
      ) || voices.find(v => v.lang.startsWith('hi'))
        || voices.find(v => v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;

      addWave(bubbleEl);
      currentUtter = utterance;

      utterance.onend = utterance.onerror = () => removeWave();

      window.speechSynthesis.speak(utterance);
    };

    
    if (window.speechSynthesis.getVoices().length > 0) {
      setVoiceAndSpeak();
    } else {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.onvoiceschanged = null;
        setVoiceAndSpeak();
      };
    }
  }

  function addWave(bubbleEl) {
    if (!bubbleEl) return;
    activeTtsBubble = bubbleEl;
    const wave = document.createElement('span');
    wave.className = 'speaking-wave';
    wave.id        = 'speakingWave';
    wave.innerHTML = '<span></span><span></span><span></span><span></span><span></span>';
    bubbleEl.querySelector('.bubble')?.appendChild(wave);
  }

  function removeWave() {
    const w = document.getElementById('speakingWave');
    if (w) w.remove();
    activeTtsBubble = null;
  }

</script>
