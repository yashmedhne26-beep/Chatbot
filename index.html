<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    body {
      font-family: 'Outfit', 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #070716;
      color: #eef1ff;
    }

    /* ── Decorative full-screen atmosphere ── */
    .app-atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      background:
        radial-gradient(1200px 700px at 8% -10%, rgba(124, 58, 237, 0.38), transparent 55%),
        radial-gradient(900px 600px at 100% 8%, rgba(14, 165, 233, 0.28), transparent 50%),
        radial-gradient(800px 500px at 70% 110%, rgba(236, 72, 153, 0.22), transparent 45%),
        linear-gradient(160deg, #0b1024 0%, #12102a 42%, #0a1628 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.7;
      animation: drift 18s ease-in-out infinite;
    }
    .orb-a {
      width: 42vw; height: 42vw; max-width: 560px; max-height: 560px;
      left: -8%; top: -12%;
      background: radial-gradient(circle, #7c3aed 0%, transparent 70%);
    }
    .orb-b {
      width: 36vw; height: 36vw; max-width: 480px; max-height: 480px;
      right: -10%; top: 18%;
      background: radial-gradient(circle, #22d3ee 0%, transparent 70%);
      animation-delay: -6s;
    }
    .orb-c {
      width: 28vw; height: 28vw; max-width: 380px; max-height: 380px;
      left: 32%; bottom: -16%;
      background: radial-gradient(circle, #f472b6 0%, transparent 70%);
      animation-delay: -11s;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4%, -5%) scale(1.08); }
    }

    .mesh-ring {
      position: absolute;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      box-shadow: inset 0 0 80px rgba(124, 58, 237, 0.12);
    }
    .mesh-ring.r1 { width: 52vmin; height: 52vmin; right: 6%; top: 22%; }
    .mesh-ring.r2 { width: 34vmin; height: 34vmin; right: 12%; top: 31%; border-color: rgba(34, 211, 238, 0.14); }

    .starfield::before,
    .starfield::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.7), transparent),
        radial-gradient(1.5px 1.5px at 28% 72%, rgba(255,255,255,.45), transparent),
        radial-gradient(1px 1px at 46% 32%, rgba(255,255,255,.55), transparent),
        radial-gradient(2px 2px at 63% 12%, rgba(165, 243, 252,.6), transparent),
        radial-gradient(1px 1px at 81% 64%, rgba(255,255,255,.4), transparent),
        radial-gradient(1.5px 1.5px at 91% 28%, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 8% 88%, rgba(196, 181, 253,.55), transparent);
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 78%);
    }
    .noise {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ── Full-screen app shell ── */
    .chat-container {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      margin: 0;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      border: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(10,12,28,0.55) 0%, rgba(8,10,24,0.72) 100%);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
    }

    :fullscreen .chat-container,
    :-webkit-full-screen .chat-container,
    :-moz-full-screen .chat-container {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      border-radius: 0 !important;
      box-shadow: none !important;
    }

    #fullscreenBtn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      color: #fff; font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.15s, border-color 0.2s;
      margin-left: 4px;
      backdrop-filter: blur(10px);
    }
    #fullscreenBtn:hover  { background: rgba(255,255,255,0.18); transform: scale(1.06); border-color: rgba(255,255,255,0.32); }
    #fullscreenBtn:active { transform: scale(0.94); }

    /* ── Header ── */
    .chat-header {
      flex-shrink: 0;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(90deg, rgba(124,58,237,0.42), rgba(14,165,233,0.28) 55%, rgba(244,114,182,0.22));
      border-bottom: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.18);
    }

    .bot-avatar {
      width: 50px; height: 50px;
      background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0.06));
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 8px 24px rgba(76, 29, 149, 0.35);
    }

    .bot-info h2 {
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .bot-info p  { color: rgba(255,255,255,0.78); font-size: 12px; margin-top: 3px; }

    .status-dot {
      width: 8px; height: 8px; background: #4ade80;
      border-radius: 50%; display: inline-block; margin-right: 5px;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.18);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    .points-badge {
      margin-left: auto;
      background: rgba(8, 10, 28, 0.35);
      border-radius: 16px;
      padding: 8px 16px;
      display: flex; flex-direction: column; align-items: center;
      border: 1px solid rgba(255,255,255,0.18);
      min-width: 78px;
      backdrop-filter: blur(16px);
    }
    .points-badge .pts-value {
      color: #fff; font-size: 20px; font-weight: 800; line-height: 1;
      font-family: 'Space Grotesk', sans-serif;
    }
    .points-badge .pts-label {
      color: rgba(255,255,255,0.7); font-size: 9px; letter-spacing: 1.4px;
      text-transform: uppercase; margin-top: 3px;
    }

    /* ── Level bar ── */
    .level-bar-wrap {
      flex-shrink: 0;
      background: rgba(255,255,255,0.04);
      padding: 10px 28px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .level-label { color: #c4b5fd; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .level-bar-bg {
      flex: 1; height: 8px; background: rgba(255,255,255,0.08);
      border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .level-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6, #22d3ee, #f472b6);
      background-size: 180% 100%;
      border-radius: 10px;
      transition: width 0.5s ease;
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.45);
      animation: sheen 6s linear infinite;
    }
    @keyframes sheen {
      0% { background-position: 0% 50%; }
      100% { background-position: 180% 50%; }
    }
    .level-next { color: rgba(255,255,255,0.38); font-size: 11px; white-space: nowrap; }

    /* ── Messages area ── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 8vw 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.22) transparent;
    }
    .chat-messages::-webkit-scrollbar { width: 8px; }
    .chat-messages::-webkit-scrollbar-thumb {
      background: linear-gradient(#7c3aed, #22d3ee);
      border-radius: 8px;
    }

    .message {
      display: flex; align-items: flex-end; gap: 10px;
      max-width: min(72%, 820px);
      animation: fadeIn 0.32s ease;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .message.bot  { align-self: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 34px; height: 34px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }
    .message.bot  .msg-avatar { background: linear-gradient(135deg,#7c3aed,#22d3ee); }
    .message.user .msg-avatar { background: linear-gradient(135deg,#f472b6,#fb7185); }

    .bubble {
      padding: 12px 16px; border-radius: 20px;
      font-size: 15px; line-height: 1.65; word-break: break-word;
    }
    .message.bot  .bubble {
      background: rgba(255,255,255,0.08);
      color: #eef1ff;
      border: 1px solid rgba(255,255,255,0.1);
      border-bottom-left-radius: 6px;
      backdrop-filter: blur(18px);
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #7c3aed, #2563eb 55%, #22d3ee);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 10px 28px rgba(37, 99, 235, 0.28);
    }

    .bubble ul { padding-left: 16px; margin-top: 4px; }
    .bubble ul li { margin-bottom: 3px; }

    .timestamp {
      font-size: 11px;
      color: rgba(255,255,255,0.32);
      margin-top: 0;
      text-align: center;
      align-self: center;
    }

    .pts-popup {
      position: fixed;
      font-size: 13px; font-weight: 700;
      color: #4ade80;
      pointer-events: none;
      animation: floatUp 1.2s ease forwards;
      z-index: 999;
      text-shadow: 0 0 12px rgba(74, 222, 128, 0.6);
    }
    @keyframes floatUp {
      0%   { opacity:1; transform: translateY(0) scale(1); }
      100% { opacity:0; transform: translateY(-50px) scale(1.3); }
    }

    .rating-row {
      display: flex; align-items: center; gap: 6px;
      padding: 2px 8px 0;
      align-self: flex-start;
      margin-left: calc(8vw + 44px);
      animation: fadeIn 0.3s ease;
    }
    .rating-row span { font-size: 12px; color: rgba(255,255,255,0.42); }
    .stars { display: flex; gap: 3px; }
    .star {
      font-size: 18px; cursor: pointer; color: rgba(255,255,255,0.18);
      transition: color 0.2s, transform 0.2s;
      user-select: none;
    }
    .star:hover, .star.active { color: #fbbf24; transform: scale(1.2); }
    .star.rated { color: #fbbf24; cursor: default; transform: none; }

    #levelUpToast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      color: #fff; padding: 14px 32px; border-radius: 999px;
      font-size: 15px; font-weight: 700;
      box-shadow: 0 12px 40px rgba(124,58,237,0.45);
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s;
      z-index: 1000;
    }
    #levelUpToast.show { opacity: 1; }

    .typing-indicator {
      display:flex; align-items:flex-end; gap:10px;
      max-width:85%; align-self:flex-start; animation:fadeIn 0.3s ease;
    }
    .typing-dots {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 14px 18px;
      border-radius: 20px; border-bottom-left-radius: 6px;
      display:flex; gap:5px; align-items:center;
      backdrop-filter: blur(16px);
    }
    .dot { width:7px; height:7px; background:#a78bfa; border-radius:50%; animation:bounce 1.2s infinite; }
    .dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

    .composer-dock {
      flex-shrink: 0;
      padding: 0 8vw 22px;
      background: linear-gradient(180deg, transparent, rgba(6,8,20,0.55) 28%);
    }

    .quick-replies { display:flex; flex-wrap:wrap; gap:8px; padding: 4px 0 12px; }
    .quick-reply-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(167, 139, 250, 0.45);
      color: #ddd6fe;
      padding: 8px 16px; border-radius: 999px;
      font-size: 13px; cursor: pointer; transition: all 0.2s;
      backdrop-filter: blur(12px);
      font-family: inherit;
    }
    .quick-reply-btn:hover {
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      color: #fff;
      border-color: transparent;
      transform: translateY(-1px);
    }

    .chat-input-area {
      padding: 10px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      display: flex; gap: 8px; align-items: center;
      backdrop-filter: blur(24px) saturate(150%);
      box-shadow: 0 16px 50px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 24px;
      padding: 12px 10px;
      color: #eef1ff;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    #userInput::placeholder { color: rgba(255,255,255,0.35); }

    #sendBtn {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, #7c3aed, #22d3ee);
      border: none; border-radius: 16px; color: #fff; font-size: 18px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.2s, opacity 0.2s; flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.38);
    }
    #sendBtn:hover  { transform: scale(1.07); }
    #sendBtn:active { transform: scale(0.95); }
    #sendBtn:disabled { opacity:.5; cursor:not-allowed; transform:none; }

    .icon-btn {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(167, 139, 250, 0.28);
      border-radius: 14px;
      color: #c4b5fd; font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.2s, color 0.2s;
      flex-shrink: 0;
    }
    .icon-btn:hover { background: #7c3aed; color: #fff; transform: scale(1.06); }
    .icon-btn:active { transform: scale(0.93); }

    #attachBtn, #micBtn, #ttsBtn { }

    #micBtn.recording {
      background: #ef4444 !important;
      color: #fff !important;
      border-color: #ef4444 !important;
      box-shadow: 0 0 0 0 rgba(239,68,68,0.7);
      animation: micPulse 1.2s infinite;
    }
    @keyframes micPulse {
      0%   { box-shadow: 0 0 0 0   rgba(239,68,68,0.7); }
      70%  { box-shadow: 0 0 0 12px rgba(239,68,68,0);   }
      100% { box-shadow: 0 0 0 0   rgba(239,68,68,0);   }
    }
    #ttsBtn.muted  { color: #555; border-color: #333; }

    .speaking-wave {
      display: inline-flex; gap: 3px; align-items: flex-end;
      height: 14px; margin-left: 8px; vertical-align: middle;
    }
    .speaking-wave span {
      width: 3px; border-radius: 3px;
      background: #22d3ee;
      animation: wave 0.9s ease-in-out infinite;
    }
    .speaking-wave span:nth-child(1) { height: 5px;  animation-delay: 0s;    }
    .speaking-wave span:nth-child(2) { height: 10px; animation-delay: 0.15s; }
    .speaking-wave span:nth-child(3) { height: 7px;  animation-delay: 0.3s;  }
    .speaking-wave span:nth-child(4) { height: 12px; animation-delay: 0.45s; }
    .speaking-wave span:nth-child(5) { height: 4px;  animation-delay: 0.6s;  }
    @keyframes wave {
      0%, 100% { transform: scaleY(1);   }
      50%       { transform: scaleY(1.9); }
    }

    #imgPreviewStrip {
      display: none;
      padding: 0 0 10px;
      gap: 8px;
      flex-wrap: wrap;
    }
    #imgPreviewStrip.has-images { display: flex; }

    .preview-thumb-wrap {
      position: relative;
      width: 64px; height: 64px;
      border-radius: 14px;
      overflow: visible;
      flex-shrink: 0;
    }
    .preview-thumb-wrap img {
      width: 64px; height: 64px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid #a78bfa;
      display: block;
    }
    .preview-thumb-remove {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px;
      background: #f87171; color: #fff;
      border-radius: 50%; border: none;
      font-size: 11px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .preview-thumb-remove:hover { background: #ef4444; }

    .chat-img-bubble {
      max-width: 280px;
      border-radius: 14px;
      overflow: hidden;
      cursor: zoom-in;
      border: 2px solid rgba(167, 139, 250, 0.4);
      display: block;
      transition: transform 0.2s;
    }
    .chat-img-bubble:hover { transform: scale(1.03); }

    #imgLightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      z-index: 3000;
      align-items: center; justify-content: center;
      cursor: zoom-out;
    }
    #imgLightbox.open { display: flex; }
    #imgLightbox img {
      max-width: 90vw; max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      animation: fadeIn 0.2s ease;
    }

    .user-avatar-wrap {
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .user-avatar-wrap:hover .cam-overlay { opacity: 1; }

    .user-header-avatar {
      width: 44px; height: 44px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.4);
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg,#f472b6,#fb7185);
    }
    .user-avatar-emoji {
      width: 44px; height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg,#f472b6,#fb7185);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .cam-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.55);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .avatar-modal-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(4, 6, 18, 0.62);
      backdrop-filter: blur(10px);
      z-index: 2000;
      align-items: center; justify-content: center;
    }
    .avatar-modal-backdrop.open { display: flex; }

    .avatar-modal {
      background: rgba(18, 16, 40, 0.86);
      border: 1px solid rgba(167, 139, 250, 0.4);
      border-radius: 24px;
      padding: 28px 26px;
      width: 340px;
      text-align: center;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
      animation: fadeIn 0.25s ease;
      backdrop-filter: blur(24px);
    }
    .avatar-modal h3 { color: #e0e0f0; font-size: 16px; margin-bottom: 18px; }

    .avatar-preview-ring {
      width: 100px; height: 100px;
      border-radius: 50%;
      margin: 0 auto 18px;
      border: 3px dashed #a78bfa;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: rgba(255,255,255,0.06);
      font-size: 40px;
      position: relative;
    }
    #modalPreviewImg {
      width: 100%; height: 100%;
      object-fit: cover;
      display: none;
      border-radius: 50%;
    }
    #modalPreviewEmoji { font-size: 40px; }

    .avatar-modal-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }

    .btn-upload {
      background: linear-gradient(135deg,#7c3aed,#22d3ee);
      color: #fff; border: none;
      padding: 11px; border-radius: 30px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
      font-family: inherit;
    }
    .btn-upload:hover { opacity: 0.85; }

    .btn-remove {
      background: transparent;
      color: #f87171; border: 1px solid #f87171;
      padding: 9px; border-radius: 30px;
      font-size: 13px; cursor: pointer;
      transition: all 0.2s;
      display: none;
      font-family: inherit;
    }
    .btn-remove:hover { background: #f87171; color: #fff; }
    .btn-remove.visible { display: block; }

    .btn-close-modal {
      background: transparent; color: #888;
      border: none; font-size: 13px;
      cursor: pointer; margin-top: 4px;
      transition: color 0.2s;
      font-family: inherit;
    }
    .btn-close-modal:hover { color: #ccc; }

    .msg-avatar img {
      width: 100%; height: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    #micStatus {
      display: none;
      background: linear-gradient(90deg, #7c3aed, #22d3ee);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 8px 14px;
      letter-spacing: .4px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    @media (max-width: 720px) {
      .chat-header, .level-bar-wrap { padding-left: 16px; padding-right: 16px; }
      .chat-messages { padding: 18px 16px 14px; }
      .composer-dock { padding: 0 12px 14px; }
      .message { max-width: 90%; }
      .rating-row { margin-left: 44px; }
      .bot-info h2 { font-size: 15px; }
    }
  </style>
</head>
<body>

<div class="app-atmosphere starfield" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="mesh-ring r1"></div>
  <div class="mesh-ring r2"></div>
  <div class="grid-lines"></div>
  <div class="noise"></div>
</div>

<div class="chat-container">

  <div class="chat-header">
    <div class="bot-avatar">✦</div>
    <div class="bot-info">
      <h2>Nova Assistant</h2>
      <p><span class="status-dot"></span>Online · Live workspace</p>
    </div>
    <div class="points-badge">
      <span class="pts-value" id="headerPoints">0</span>
      <span class="pts-label">Points</span>
    </div>
    <div class="user-avatar-wrap" onclick="openAvatarModal()" title="Change your profile photo">
      <div class="user-avatar-emoji" id="userHeaderAvatarEmoji">👤</div>
      <img class="user-header-avatar" id="userHeaderAvatarImg" src="" alt="You" style="display:none"/>
      <div class="cam-overlay">📷</div>
    </div>
    <button id="fullscreenBtn" onclick="toggleFullscreen()" title="Toggle fullscreen">⛶</button>
  </div>

  <div class="level-bar-wrap">
    <span class="level-label" id="levelLabel">⭐ Level 1</span>
    <div class="level-bar-bg">
      <div class="level-bar-fill" id="levelBarFill" style="width:0%"></div>
    </div>
    <span class="level-next" id="levelNext">0 / 50 pts</span>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="composer-dock">
    <div class="quick-replies" id="quickReplies">
      <button class="quick-reply-btn" onclick="sendQuick('Hello!')">👋 Hello</button>
      <button class="quick-reply-btn" onclick="sendQuick('What can you do?')">💡 Help</button>
      <button class="quick-reply-btn" onclick="sendQuick('Tell me a joke')">😄 Joke</button>
      <button class="quick-reply-btn" onclick="sendQuick('What time is it?')">🕐 Time</button>
      <button class="quick-reply-btn" onclick="sendQuick('My score')">🏆 My Score</button>
    </div>

    <div id="imgPreviewStrip"></div>

    <div id="micStatus">🎙️ Listening… speak now</div>

    <div class="chat-input-area">
      <button id="attachBtn" class="icon-btn" onclick="document.getElementById('chatImgInput').click()" title="Attach image">📷</button>
      <button id="micBtn" class="icon-btn" onclick="toggleMic()" title="Speak your message">🎤</button>
      <input type="text" id="userInput" placeholder="Message Nova…" autocomplete="off" />
      <button id="ttsBtn" class="icon-btn" onclick="toggleTTS()" title="Toggle voice replies">🔊</button>
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

</div>

<input type="file" id="chatImgInput" accept="image/*" multiple style="display:none" onchange="handleChatImageSelect(event)"/>

<div id="imgLightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="Full size"/>
</div>

<div class="avatar-modal-backdrop" id="avatarModalBackdrop" onclick="backdropClose(event)">
  <div class="avatar-modal">
    <h3>📷 Your Profile Photo</h3>
    <div class="avatar-preview-ring">
      <span id="modalPreviewEmoji">👤</span>
      <img id="modalPreviewImg" src="" alt="Preview"/>
    </div>
    <p style="color:#777;font-size:12px;margin-bottom:4px;">Click below to upload a photo (JPG, PNG, GIF, WebP)</p>
    <div class="avatar-modal-btns">
      <button class="btn-upload" onclick="document.getElementById('avatarFileInput').click()">
        📁 Choose Photo
      </button>
      <button class="btn-remove" id="btnRemovePhoto" onclick="removeAvatar()">
        🗑️ Remove Photo
      </button>
      <button class="btn-close-modal" onclick="closeAvatarModal()">Cancel</button>
    </div>
  </div>
</div>

<input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)"/>

<div id="levelUpToast">🎉 Level Up!</div>

<script>
  /* ══════════════════════════════
     IMAGE ATTACHMENT SYSTEM
  ══════════════════════════════ */
  let pendingImages = []; // array of { dataUrl, name }

  function handleChatImageSelect(event) {
    const files = Array.from(event.target.files);
    if (!files.length) return;

    files.forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        pendingImages.push({ dataUrl: e.target.result, name: file.name });
        renderPreviewStrip();
      };
      reader.readAsDataURL(file);
    });

    event.target.value = '';
  }

  function renderPreviewStrip() {
    const strip = document.getElementById('imgPreviewStrip');
    strip.innerHTML = '';

    if (pendingImages.length === 0) {
      strip.classList.remove('has-images');
      return;
    }

    strip.classList.add('has-images');
    pendingImages.forEach((img, idx) => {
      const wrap = document.createElement('div');
      wrap.className = 'preview-thumb-wrap';

      const thumb = document.createElement('img');
      thumb.src = img.dataUrl;
      thumb.alt = img.name;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'preview-thumb-remove';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove';
      removeBtn.onclick = () => {
        pendingImages.splice(idx, 1);
        renderPreviewStrip();
      };

      wrap.appendChild(thumb);
      wrap.appendChild(removeBtn);
      strip.appendChild(wrap);
    });
  }

  function addImageMessage(dataUrl, name) {
    const container = document.getElementById('chatMessages');
    const wrapper   = document.createElement('div');
    wrapper.className = 'message user';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    if (userAvatarDataUrl) {
      const avImg = document.createElement('img');
      avImg.src = userAvatarDataUrl;
      avImg.alt = 'You';
      avatar.appendChild(avImg);
    } else {
      avatar.textContent = '👤';
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.style.padding = '6px';

    const chatImg = document.createElement('img');
    chatImg.src = dataUrl;
    chatImg.alt = name || 'Image';
    chatImg.className = 'chat-img-bubble';
    chatImg.onclick = () => openLightbox(dataUrl);
    chatImg.title = '🔍 Click to enlarge';

    bubble.appendChild(chatImg);
    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    container.appendChild(wrapper);

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = getTime();
    container.appendChild(ts);

    container.scrollTop = container.scrollHeight;
    return wrapper;
  }

  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('imgLightbox').classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('imgLightbox').classList.remove('open');
    document.getElementById('lightboxImg').src = '';
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  let userAvatarDataUrl = null;

  function openAvatarModal() {
    document.getElementById('avatarModalBackdrop').classList.add('open');
  }

  function closeAvatarModal() {
    document.getElementById('avatarModalBackdrop').classList.remove('open');
  }

  function backdropClose(e) {
    if (e.target === document.getElementById('avatarModalBackdrop')) closeAvatarModal();
  }

  function handleAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file || !file.type.startsWith('image/')) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      userAvatarDataUrl = e.target.result;

      document.getElementById('modalPreviewImg').src   = userAvatarDataUrl;
      document.getElementById('modalPreviewImg').style.display  = 'block';
      document.getElementById('modalPreviewEmoji').style.display = 'none';
      document.getElementById('btnRemovePhoto').classList.add('visible');

      document.getElementById('userHeaderAvatarImg').src          = userAvatarDataUrl;
      document.getElementById('userHeaderAvatarImg').style.display = 'block';
      document.getElementById('userHeaderAvatarEmoji').style.display = 'none';

      setTimeout(closeAvatarModal, 600);
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function removeAvatar() {
    userAvatarDataUrl = null;

    document.getElementById('modalPreviewImg').style.display   = 'none';
    document.getElementById('modalPreviewImg').src             = '';
    document.getElementById('modalPreviewEmoji').style.display = '';
    document.getElementById('btnRemovePhoto').classList.remove('visible');

    document.getElementById('userHeaderAvatarImg').style.display  = 'none';
    document.getElementById('userHeaderAvatarImg').src            = '';
    document.getElementById('userHeaderAvatarEmoji').style.display = '';

    closeAvatarModal();
  }

  let totalPoints = 0;
  let currentLevel = 1;

  function thresholdForLevel(lvl) {
    return lvl <= 1 ? 0 : 25 * (lvl - 1) * lvl;
  }

  function getLevelFor(pts) {
    let lvl = 1;
    while (thresholdForLevel(lvl + 1) <= pts) lvl++;
    return lvl;
  }

  function addPoints(amount, originEl) {
    const prevLevel = getLevelFor(totalPoints);
    totalPoints += amount;
    const newLevel = getLevelFor(totalPoints);

    document.getElementById('headerPoints').textContent = totalPoints;
    updateLevelBar();

    if (originEl) {
      const rect = originEl.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'pts-popup';
      pop.textContent = `+${amount} pts`;
      pop.style.left = rect.left + 'px';
      pop.style.top  = (rect.top - 10) + 'px';
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1300);
    }

    if (newLevel > prevLevel) {
      currentLevel = newLevel;
      showLevelUpToast(newLevel);
    }
  }

  function updateLevelBar() {
    const level      = getLevelFor(totalPoints);
    const thisLvlPts = thresholdForLevel(level);
    const nextLvlPts = thresholdForLevel(level + 1);
    const earned     = totalPoints - thisLvlPts;
    const needed     = nextLvlPts - thisLvlPts;
    const progress   = (earned / needed) * 100;

    document.getElementById('levelLabel').textContent   = `⭐ Level ${level} · ${totalPoints} pts total`;
    document.getElementById('levelBarFill').style.width = progress + '%';
    document.getElementById('levelNext').textContent    = `${earned} / ${needed} pts to next level`;
  }

  function showLevelUpToast(level) {
    const toast = document.getElementById('levelUpToast');
    toast.textContent = `🎉 Level Up! You're now Level ${level}!`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function addRatingRow(afterEl) {
    const row = document.createElement('div');
    row.className = 'rating-row';
    row.innerHTML = `<span>Rate this reply:</span>
      <div class="stars" id="stars-${Date.now()}">
        <span class="star" data-v="1">★</span>
        <span class="star" data-v="2">★</span>
        <span class="star" data-v="3">★</span>
        <span class="star" data-v="4">★</span>
        <span class="star" data-v="5">★</span>
      </div>`;

    const starsDiv = row.querySelector('.stars');
    const starEls  = starsDiv.querySelectorAll('.star');

    starEls.forEach(star => {
      star.addEventListener('mouseenter', () => {
        const v = +star.dataset.v;
        starEls.forEach(s => s.classList.toggle('active', +s.dataset.v <= v));
      });
      star.addEventListener('mouseleave', () => {
        starEls.forEach(s => s.classList.remove('active'));
      });
      star.addEventListener('click', () => {
        const v = +star.dataset.v;
        starEls.forEach(s => {
          s.classList.toggle('rated', +s.dataset.v <= v);
          s.style.pointerEvents = 'none';
          s.classList.remove('active');
        });
        const bonus = v * 2;
        addPoints(bonus, star);
        row.querySelector('span').textContent = `Thanks for rating! +${bonus} pts`;
      });
    });

    const container = document.getElementById('chatMessages');
    container.insertBefore(row, afterEl ? afterEl.nextSibling : null);
    if (!afterEl) container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  const responses = {
    greetings: {
      patterns: ['hello','hi','hey','greetings','good morning','good afternoon','good evening','howdy'],
      replies: [
        "Hey there! 👋 How can I help you today?",
        "Hello! Great to see you here. What's on your mind? 😊",
        "Hi! I'm your AI assistant — ask me anything!",
      ]
    },
    howAreYou: {
      patterns: ['how are you','how do you do','how r u','whats up',"what's up"],
      replies: [
        "I'm doing great, thanks for asking! 😄 How about you?",
        "Running at full capacity! Ready to help you. 🚀",
        "Fantastic! Every conversation makes me happy. 😊",
      ]
    },
    name: {
      patterns: ['your name','who are you','what are you','what is your name',"what's your name"],
      replies: [
        "I'm **Nova Assistant** — a friendly chatbot built to help you! ✦",
        "You can call me **Nova**. I'm here to chat and help!",
      ]
    },
    score: {
      patterns: ['my score','my points','how many points','score','points'],
      replies: ['__SCORE__']
    },
    joke: {
      patterns: ['joke','funny','make me laugh','tell me a joke'],
      replies: [
        "Why do programmers prefer dark mode? 🌙\nBecause **light attracts bugs**! 🐛😂",
        "I told my computer I needed a break...\nNow it won't stop sending me Kit-Kat ads! 🍫😄",
        "Why do Java developers wear glasses? 👓\nBecause they don't **C#**! 😂",
        "A SQL query walks into a bar and asks two tables:\n**'Can I JOIN you?'** 😄",
      ]
    },
    time: {
      patterns: ['time','what time','current time','clock'],
      replies: [`⏰ The current time is **${new Date().toLocaleTimeString()}**`]
    },
    date: {
      patterns: ['date','today','what day','current date'],
      replies: [`📅 Today is **${new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}**`]
    },
    capabilities: {
      patterns: ['what can you do','help','capabilities','features','what do you do'],
      replies: [
        `Here's what I can do for you:\n• 💬 Chat & answer questions\n• 😄 Tell jokes\n• 🕐 Tell you the time & date\n• 🧮 Solve math expressions\n• 🏆 Track your points & level\n• ⭐ Rate my replies\n\nJust ask me anything!`
      ]
    },
    weather: {
      patterns: ['weather','temperature','rain','sunny','forecast'],
      replies: ["I don't have live weather data 🌤️\nBut you can check **weather.com** for the latest forecast!\n\nWould you like to chat about something else?"]
    },
    thanks: {
      patterns: ['thanks','thank you','ty','thx','appreciate'],
      replies: [
        "You're welcome! 😊 Anything else I can help with?",
        "Happy to help! 🎉",
        "Anytime! That's what I'm here for. ✦",
      ]
    },
    bye: {
      patterns: ['bye','goodbye','see you','farewell','exit','quit'],
      replies: [
        "Goodbye! 👋 Have a wonderful day!",
        "See you later! Take care 😊",
        "Bye! Come back anytime — I'll keep your points safe! ✦",
      ]
    },
    love: {
      patterns: ['i love you','love you'],
      replies: [
        "Aww, that's sweet! ❤️ I care about helping you!",
        "You're making me blush! 😊 I love helping you too!",
      ]
    },
  };

  const defaultReplies = [
    "That's interesting! Could you tell me more? 🤔",
    "Hmm, I'm not sure about that. Try asking me something else! 💭",
    "I'm still learning! But I'd love to chat more. 😊",
    "Great question! I don't have a perfect answer, but let's keep talking. 🗣️",
    "I'm not sure I understood. Could you rephrase that? 🤔",
  ];

  function getResponse(input) {
    const lower = input.toLowerCase().trim();

    if (/^[\d\s\+\-\*\/\.\(\)]+$/.test(lower) && lower.length > 1) {
      try {
        const result = Function('"use strict"; return (' + lower + ')')();
        if (!isNaN(result)) return `🧮 The answer is: **${result}**`;
      } catch(e) {}
    }

    for (const [, cat] of Object.entries(responses)) {
      if (cat.patterns.some(p => lower.includes(p))) {
        const r = cat.replies[Math.floor(Math.random() * cat.replies.length)];
        if (r === '__SCORE__') {
          const lvl      = getLevelFor(totalPoints);
          const nextPts  = thresholdForLevel(lvl + 1);
          const needed   = nextPts - totalPoints;
          return `🏆 Your stats:\n• **Points:** ${totalPoints}\n• **Level:** ${lvl}\n• **Messages sent:** ${messageCount}\n• **Next level in:** ${needed} pts\n\nKeep chatting — levels are unlimited! 🚀`;
        }
        return r;
      }
    }

    return defaultReplies[Math.floor(Math.random() * defaultReplies.length)];
  }

  let messageCount = 0;

  function getTime() {
    return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function renderText(text) {
    let html = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    const lines = html.split('\n');
    let result = '';
    let inList = false;
    lines.forEach(line => {
      const trimmed = line.trim();
      if (trimmed.startsWith('•')) {
        if (!inList) { result += '<ul>'; inList = true; }
        result += `<li>${trimmed.slice(1).trim()}</li>`;
      } else {
        if (inList) { result += '</ul>'; inList = false; }
        result += (result && !result.endsWith('>') ? '<br>' : '') + line;
      }
    });
    if (inList) result += '</ul>';
    return result;
  }

  function addMessage(text, sender) {
    const container = document.getElementById('chatMessages');
    const wrapper   = document.createElement('div');
    wrapper.className = `message ${sender}`;

    const avatar  = document.createElement('div');
    avatar.className = 'msg-avatar';

    if (sender === 'bot') {
      avatar.textContent = '✦';
    } else if (userAvatarDataUrl) {
      const img = document.createElement('img');
      img.src = userAvatarDataUrl;
      img.alt = 'You';
      avatar.appendChild(img);
    } else {
      avatar.textContent = '👤';
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = renderText(text);

    wrapper.appendChild(avatar);
    wrapper.appendChild(bubble);
    container.appendChild(wrapper);

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = getTime();
    container.appendChild(ts);

    container.scrollTop = container.scrollHeight;
    return wrapper;
  }

  function showTyping() {
    const container = document.getElementById('chatMessages');
    const typing    = document.createElement('div');
    typing.className = 'typing-indicator';
    typing.id = 'typingIndicator';

    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.style.background = 'linear-gradient(135deg,#7c3aed,#22d3ee)';
    av.textContent = '✦';

    const dots = document.createElement('div');
    dots.className = 'typing-dots';
    dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    typing.appendChild(av);
    typing.appendChild(dots);
    container.appendChild(typing);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  function sendMessage() {
    const input = document.getElementById('userInput');
    const text  = input.value.trim();
    const hasImages = pendingImages.length > 0;

    if (!text && !hasImages) return;

    if (hasImages) {
      const imagesToSend = [...pendingImages];
      pendingImages = [];
      renderPreviewStrip();

      imagesToSend.forEach(img => {
        addImageMessage(img.dataUrl, img.name);
        addPoints(3, document.getElementById('headerPoints'));
      });
    }

    if (!text) return;

    messageCount++;
    addMessage(text, 'user');
    addPoints(5, document.getElementById('headerPoints'));
    input.value = '';

    document.getElementById('sendBtn').disabled = true;
    document.getElementById('quickReplies').style.display = 'none';

    showTyping();

    setTimeout(() => {
      removeTyping();
      const reply = getResponse(text);
      const msgEl = addMessage(reply, 'bot');
      addRatingRow(msgEl.nextSibling);
      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }, 700 + Math.random() * 600);
  }

  function sendQuick(text) {
    document.getElementById('userInput').value = text;
    sendMessage();
  }

  document.getElementById('userInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') sendMessage();
  });

  window.addEventListener('load', () => {
    updateLevelBar();
    setTimeout(() => {
      const el = addMessage("👋 Hi! I'm **Nova Assistant**.\nType a message to earn points and level up! 🏆", 'bot');
      addRatingRow(el.nextSibling);
    }, 400);
  });

  function toggleFullscreen() {
    const el = document.documentElement;
    const isFs = !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement
    );

    if (!isFs) {
      if      (el.requestFullscreen)       el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.mozRequestFullScreen)    el.mozRequestFullScreen();
    } else {
      if      (document.exitFullscreen)       document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.mozCancelFullScreen)  document.mozCancelFullScreen();
    }
  }

  function onFullscreenChange() {
    const isFs = !!(
      document.fullscreenElement ||
      document.webkitFullscreenElement ||
      document.mozFullScreenElement
    );
    const btn = document.getElementById('fullscreenBtn');
    btn.textContent = isFs ? '⊠' : '⛶';
    btn.title       = isFs ? 'Exit fullscreen' : 'Enter fullscreen';
  }

  document.addEventListener('fullscreenchange',       onFullscreenChange);
  document.addEventListener('webkitfullscreenchange', onFullscreenChange);
  document.addEventListener('mozfullscreenchange',    onFullscreenChange);

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition  = null;
  let isListening  = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang          = 'en-US';
    recognition.interimResults = true;
    recognition.continuous     = false;

    recognition.onstart = () => {
      isListening = true;
      document.getElementById('micBtn').classList.add('recording');
      document.getElementById('micBtn').title = 'Stop listening';
      document.getElementById('micStatus').style.display = 'block';
      document.getElementById('userInput').placeholder   = '🎙️ Listening…';
    };

    recognition.onresult = (e) => {
      let interim = '', final = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += t;
        else                       interim += t;
      }
      document.getElementById('userInput').value = final || interim;
    };

    recognition.onend = () => {
      isListening = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('micBtn').title = 'Speak your message';
      document.getElementById('micStatus').style.display = 'none';
      document.getElementById('userInput').placeholder   = 'Message Nova…';

      const txt = document.getElementById('userInput').value.trim();
      if (txt) sendMessage();
    };

    recognition.onerror = (e) => {
      console.warn('STT error:', e.error);
      isListening = false;
      document.getElementById('micBtn').classList.remove('recording');
      document.getElementById('micStatus').style.display = 'none';
      document.getElementById('userInput').placeholder   = 'Message Nova…';
      if (e.error === 'not-allowed') {
        alert('Microphone access was denied. Please allow mic access in your browser settings.');
      }
    };
  }

  function toggleMic() {
    if (!SpeechRecognition) {
      alert('⚠️ Your browser does not support Speech Recognition.\nPlease use Chrome or Edge.');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  }

  let ttsEnabled    = true;
  let currentUtter  = null;
  let activeTtsBubble = null;

  function toggleTTS() {
    ttsEnabled = !ttsEnabled;
    const btn = document.getElementById('ttsBtn');
    if (ttsEnabled) {
      btn.textContent = '🔊';
      btn.title       = 'Mute voice replies';
      btn.classList.remove('muted');
    } else {
      btn.textContent = '🔇';
      btn.title       = 'Unmute voice replies';
      btn.classList.add('muted');
      window.speechSynthesis.cancel();
      removeWave();
    }
  }

  function speak(text, bubbleEl) {
    if (!ttsEnabled || !window.speechSynthesis) return;

    window.speechSynthesis.cancel();
    removeWave();

    const clean = text.replace(/\*\*(.*?)\*\*/g, '$1').replace(/•/g, '');

    const utterance  = new SpeechSynthesisUtterance(clean);
    utterance.lang   = 'en-US';
    utterance.rate   = 1.0;
    utterance.pitch  = 1.05;
    utterance.volume = 1.0;

    const voices = window.speechSynthesis.getVoices();
    const preferred = voices.find(v =>
      v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Samantha'))
    ) || voices.find(v => v.lang.startsWith('en'));
    if (preferred) utterance.voice = preferred;

    addWave(bubbleEl);
    currentUtter = utterance;

    utterance.onend = utterance.onerror = () => removeWave();

    window.speechSynthesis.speak(utterance);
  }

  function addWave(bubbleEl) {
    if (!bubbleEl) return;
    activeTtsBubble = bubbleEl;
    const wave = document.createElement('span');
    wave.className = 'speaking-wave';
    wave.id        = 'speakingWave';
    wave.innerHTML = '<span></span><span></span><span></span><span></span><span></span>';
    bubbleEl.querySelector('.bubble')?.appendChild(wave);
  }

  function removeWave() {
    const w = document.getElementById('speakingWave');
    if (w) w.remove();
    activeTtsBubble = null;
  }

  window.speechSynthesis.onvoiceschanged = () => {};

</script>
</body>
